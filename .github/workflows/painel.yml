name: Atualiza painel do perfil

on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/painel.py", ".github/workflows/painel.yml"]

permissions:
  contents: write

jobs:
  painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gera o painel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # repositórios fora da conta de linguagens (trabalhos de faculdade e portfólio antigo)
          EXCLUDE_REPOS: Data_Structure_1_in_Java,Data_Structure_2_in_C-C-,React_native,support_ticket_system,jpdagostin-portifolio,githubPagesJP
        run: python .github/scripts/painel.py --user "${{ github.repository_owner }}"
      - name: Commita se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add assets/painel-light.svg assets/painel-dark.svg
          git diff --cached --quiet || git commit -m "Atualiza painel do perfil" && git push
